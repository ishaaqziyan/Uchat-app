name: Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/uchatfinal_test

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uchatfinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Diesel CLI
      run: cargo install diesel_cli --no-default-features --features postgres

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Create .env file
      run: |
        echo "API_DATABASE_URL=postgres://postgres:password@localhost:5432/uchatfinal_test" >> .env
        echo "API_PRIVATE_KEY=super_secret_test_key" >> .env
        echo "API_URL=http://127.0.0.1:8070/" >> .env
        echo "API_BIND=127.0.0.1:8070" >> .env
        echo "DATABASE_URL=postgres://postgres:password@localhost:5432/uchatfinal_test" >> .env
        echo "TEST_DATABASE_URL=postgres://postgres:password@localhost:5432/uchatfinal_test" >> .env
        echo "FRONTEND_URL=http://127.0.0.1:8080" >> .env

    - name: Setup Database and Run Migrations
      run: |
        diesel setup
        diesel migration run
      env:
        DATABASE_URL: postgres://postgres:password@localhost:5432/uchatfinal_test

    - name: Run Tests
      run: cargo nextest run

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/Dockerfile
        build-args: |
          API_URL=http://localhost:8070/
        tags: uchat-backend:ci
        load: true
        cache-from: type=gha,scope=backend
        cache-to: type=gha,mode=max,scope=backend

    - name: Build frontend image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: frontend/Dockerfile
        build-args: |
          API_URL=http://localhost:8070/
        tags: uchat-frontend:ci
        load: true
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend

    - name: Start containers
      run: docker compose up -d

    - name: Wait for backend
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8070/account/wallet/nonce -X POST \
            -H 'content-type: application/json' \
            -d '{"address":"0x0102030405060708090a0b0c0d0e0f1011121314"}' > /dev/null; then
            echo "backend is up"
            exit 0
          fi
          sleep 2
        done
        echo "backend failed to become healthy"
        docker compose logs
        exit 1

    - name: Wait for frontend
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/ > /dev/null; then
            echo "frontend is up"
            exit 0
          fi
          sleep 2
        done
        echo "frontend failed to become healthy"
        docker compose logs
        exit 1

    - name: Dump logs on failure
      if: failure()
      run: docker compose logs

    - name: Tear down
      if: always()
      run: docker compose down -v
